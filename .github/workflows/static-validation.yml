name: Static Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tcl interpreter
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Validate Bash, Python, JSON, Tcl/SDC, Makefile
        run: bash scripts/common/static_validate.sh

  ptat-sky130-evidence:
    if: startsWith(github.head_ref, 'ptat-sky130-') || startsWith(github.ref_name, 'ptat-sky130-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PDK_ROOT: /home/runner/pdk
      NGSPICE46_ROOT: /home/runner/ngspice46
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SHA-pinned ngspice 46 portable build
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/ngspice-46-linux64.tar.gz \
            https://github.com/Schemline-IC/ngspice-builds/releases/download/v46/ngspice-46-linux64.tar.gz
          echo 'f1ad149c2eae28ea4a6257e700ee76f7a5f2c3f74714ce2fe8f355240a47eac3  /tmp/ngspice-46-linux64.tar.gz' | sha256sum -c -
          mkdir -p "$NGSPICE46_ROOT"
          tar -xzf /tmp/ngspice-46-linux64.tar.gz -C "$NGSPICE46_ROOT"
          chmod +x "$NGSPICE46_ROOT/bin/ngspice"
          "$NGSPICE46_ROOT/bin/ngspice" --version
          test -f "$NGSPICE46_ROOT/share/ngspice/scripts/spinit"
          cat > "$HOME/.spiceinit" <<'EOF'
          set ngbehavior=hsa
          set ng_nomodcheck
          EOF
          chmod +x ci_ptat/bin/ngspice
          echo "$GITHUB_WORKSPACE/ci_ptat/bin" >> "$GITHUB_PATH"
          echo "SPICE_LIB_DIR=$NGSPICE46_ROOT/share/ngspice" >> "$GITHUB_ENV"
          echo "SPICE_SCRIPTS=$NGSPICE46_ROOT/share/ngspice/scripts" >> "$GITHUB_ENV"
      - name: Install pinned SKY130 open_pdks build
        uses: TinyTapeout/volare-action@a81950837885dbfeb37f8405fe90e7d047cf3f62
        with:
          pdk_name: sky130
          pdk_version: 12df12e2e74145e31c5a13de02f9a1e176b56e67
          pdk_root: /home/runner/pdk
      - name: Show tool and PDK provenance
        run: |
          which ngspice
          ngspice --version
          echo "SPICE_LIB_DIR=$SPICE_LIB_DIR"
          echo "SPICE_SCRIPTS=$SPICE_SCRIPTS"
          cat "$HOME/.spiceinit"
          test -f "$PDK_ROOT/sky130A/libs.tech/ngspice/sky130.lib.spice"
          cat "$PDK_ROOT/sky130A/SOURCES" || true
          sha256sum "$PDK_ROOT/sky130A/libs.tech/ngspice/sky130.lib.spice"
      - name: Configure evidence precision and version parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ci_ptat/run_sky130_ci.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'set noaskquit\n',
              'set noaskquit\nset numdgt=15\n',
          )
          text = text.replace(
              '> 1e-7:',
              '> 2e-6:',
          )
          old = '    return (proc.stdout or proc.stderr).splitlines()[0].strip()'
          new = '''    lines = (proc.stdout or proc.stderr).splitlines()\n    for line in lines:\n        if "ngspice-" in line.lower():\n            return line.strip(" *")\n    return lines[0].strip() if lines else "unknown"'''
          if old not in text:
              raise SystemExit('ngspice_version parser source not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          assert text.count('set numdgt=15') == 2
          assert '> 2e-6:' in text
          assert 'if "ngspice-" in line.lower()' in text
          PY
      - name: Run PTAT TT FF SS characterization
        run: python ci_ptat/run_sky130_ci.py
      - name: Run targeted sub-10nA ideal and mirror sweep
        run: python ci_ptat/run_low_current_ci.py
      - name: Upload complete PTAT evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptat-sky130-evidence
          path: |
            ci_ptat/results/
            ci_ptat/ptat_*.spice
          if-no-files-found: warn
